monolog:
  channels: ['audit']
  handlers:
    main:
      type: rotating_file
      path: '%kernel.logs_dir%/%kernel.environment%.log'
      level: info
      max_files: 14
    console:
      type: console
      process_psr_3_messages: false
      channels: ['!event', '!doctrine']

when@test:
  monolog:
    handlers:
      main:
        type: stream
        path: '%kernel.logs_dir%/%kernel.environment%.log'
        level: debug

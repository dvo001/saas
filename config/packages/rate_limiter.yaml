framework:
  rate_limiter:
    account_recovery:
      policy: sliding_window
      limit: 5
      interval: '1 hour'
    invitation:
      policy: sliding_window
      limit: 10
      interval: '1 hour'
    two_factor:
      policy: sliding_window
      limit: 10
      interval: '1 minute'
    registration:
      policy: sliding_window
      limit: 10
      interval: '1 hour'
    sensitive_action:
      policy: token_bucket
      limit: 10
      rate: { interval: '1 minute', amount: 5 }

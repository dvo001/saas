parameters:
  app.install_lock_path: '%kernel.project_dir%/storage/installed.lock'
  app.storage_path: '%kernel.project_dir%/storage'

services:
  _defaults:
    autowire: true
    autoconfigure: true
    bind:
      $projectDirectory: '%kernel.project_dir%'

  App\:
    resource: '../src/'
    exclude:
      - '../src/Kernel.php'
      - '../src/Core/Infrastructure/Doctrine/Entity/'

  App\Core\Infrastructure\Installation\InstallationState:
    arguments:
      $lockPath: '%app.install_lock_path%'
      $installerEnabled: '%env(bool:APP_INSTALLER_ENABLED)%'

  App\Core\Infrastructure\Installation\EnvironmentWriter:
    arguments:
      $projectDirectory: '%kernel.project_dir%'

  App\Core\Infrastructure\Installation\InstallationService:
    arguments:
      $projectDirectory: '%kernel.project_dir%'

  App\Core\Infrastructure\Logging\SensitiveDataProcessor:
    tags:
      - { name: monolog.processor }

  App\Core\Infrastructure\Security\SecretCipher:
    arguments:
      $appSecret: '%kernel.secret%'

  App\Core\Infrastructure\Security\AuditLogger:
    arguments:
      $appSecret: '%kernel.secret%'

  App\Core\Infrastructure\Support\SupportSessionService:
    arguments:
      $appSecret: '%kernel.secret%'

  App\Core\Infrastructure\System\SystemStatusService:
    arguments:
      $mailerDsn: '%env(MAILER_DSN)%'

  App\Core\Infrastructure\Mail\SystemMailer:
    arguments:
      $appSecret: '%kernel.secret%'

  App\Core\Presentation\Web\EventSubscriber\AuthRateLimitSubscriber:
    arguments:
      $recoveryLimiter: '@limiter.account_recovery'
      $invitationLimiter: '@limiter.invitation'
      $twoFactorLimiter: '@limiter.two_factor'
      $registrationLimiter: '@limiter.registration'

  App\Core\Infrastructure\Tenancy\EventAccess:
    public: true

  App\Core\Presentation\Cli\PlatformAdminEmergencyUnlockCommand:
    arguments:
      $emergencyRecoveryToken: '%env(PLATFORM_EMERGENCY_RECOVERY_TOKEN)%'

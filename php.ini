; PHP 8.5 production configuration for Swiss Club SaaS

; Required application extensions. PHP accepts the portable module names below
; and adds the platform-specific file suffix automatically.
extension = ctype
extension = fileinfo
extension = gd
extension = iconv
extension = intl
extension = mbstring
extension = mysqlnd
extension = pdo
extension = pdo_mysql
extension = zip

; openssl and sodium are compiled into the PHP 8.5 runtime and therefore do not
; need an extension directive. OPcache is configured below and is commonly
; compiled in or loaded as a Zend extension by the hosting provider.

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
ignore_repeated_errors = Off
html_errors = Off

max_execution_time = 60
max_input_time = 60
max_input_vars = 2000
memory_limit = 256M

file_uploads = On
upload_max_filesize = 4M
max_file_uploads = 10
post_max_size = 6M

default_charset = "UTF-8"
default_socket_timeout = 60
allow_url_fopen = On
allow_url_include = Off
enable_dl = Off

; Symfony handles the application timezone. Setting it here also keeps CLI and
; error-log timestamps deterministic for the Swiss deployment.
date.timezone = Europe/Zurich

[CLI Server]
cli_server.color = On

[Session]
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.cookie_lifetime = 0
session.gc_maxlifetime = 1440
session.cache_limiter = nocache
session.use_trans_sid = 0

[Assertion]
zend.assertions = -1

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 10
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1
opcache.jit = off

[realpath_cache]
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[mail function]
mail.add_x_header = Off
